name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ── Test ────────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      AZURE_API_KEY: test-key
      AZURE_API_BASE: https://test.example.com/anthropic
      AZURE_API_MODEL: test-model
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

  # ── Docs ────────────────────────────────────────────────────────────
  docs:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AZURE_API_KEY: stub
      AZURE_API_BASE: https://stub.example.com
      AZURE_API_MODEL: stub-model
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate docs
        env:
          PYTHONPATH: ${{ github.workspace }}
          AZURE_API_KEY: test-key
          AZURE_API_BASE: https://test.example.com/anthropic
          AZURE_API_MODEL: test-model
        run: |
          pdoc simulation_engine game_world command_parser \
               content_generator behavior_analyzer adaptation_ai main \
               -o docs/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/

  # ── Release ─────────────────────────────────────────────────────────
  release:
    needs: [test, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Package source
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OUTFILE="/tmp/thegiantsdrink-${TAG}.tar.gz"
          tar czf "$OUTFILE" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='htmlcov' \
            --exclude='*.tar.gz' \
            .
          cp "$OUTFILE" "thegiantsdrink-${TAG}.tar.gz" 
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: thegiantsdrink-*.tar.gz
